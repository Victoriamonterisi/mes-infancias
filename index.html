  :root{
    --azul:#1A1A38;
    --magenta:#EE2A7B;
    --magenta-dark:#9E005D;
    --gris:#E6E6E6;
    --violeta:#B95DEE;
    --rosa:#F2CED3;
    --crema:#FDEFE0;
    --amarillo:#FFF655;
    --naranja:#FCA653;
    --fucsia:#FB56AD;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--white);
    color:var(--azul);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.headline{
    font-family:'Poppins',sans-serif;
    font-weight:900;
    letter-spacing:0;
    text-transform:none;
  }
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

  /* ===== TOPBAR ===== */
  .topbar{
    background:var(--magenta);
    padding:18px 0;
  }
  .topbar-inner{display:flex;align-items:center;}
  .go-logo{display:flex;align-items:center;}
  .go-logo img{height:44px;width:auto;}

  /* ===== HERO ===== */
  .hero{
    background:var(--rosa);
    color:var(--azul);
    padding:56px 0 64px;
    position:relative;
    overflow:hidden;
  }
  .hero-doodle{
    position:absolute;
    font-size:52px;
    line-height:1;
    filter:drop-shadow(0 4px 6px rgba(26,26,56,.12));
    user-select:none;
  }
  .hero-doodle.d1{top:12%;left:6%;font-size:44px;transform:rotate(-12deg);}
  .hero-doodle.d3{top:15%;right:7%;font-size:50px;transform:rotate(10deg);}
  .hero-inner{position:relative;z-index:2;text-align:center;max-width:680px;margin:0 auto;}
  .hero-banner{width:100%;max-width:660px;height:auto;margin:0 auto 30px;border-radius:16px;}
  .eyebrow{
    display:block;
    color:var(--magenta);
    font-weight:800;
    font-size:15px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .hero h1{
    font-size:clamp(30px,6vw,48px);
    line-height:1;
    margin-bottom:18px;
  }
  .hero h1 .line1{
    display:block;
    color:var(--rosa);
    -webkit-text-stroke:2px var(--magenta-dark);
    text-stroke:2px var(--magenta-dark);
    font-size:.62em;
    margin-bottom:2px;
  }
  .hero h1 .line2{
    display:block;
    color:var(--magenta);
    -webkit-text-stroke:2.5px var(--magenta-dark);
    text-stroke:2.5px var(--magenta-dark);
    font-size:1.35em;
  }
  .hero-pill{
    display:inline-block;
    background:var(--magenta);
    color:var(--white);
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:.5px;
    padding:10px 24px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .hero-tagline{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:16px;
    color:var(--naranja);
    margin-bottom:30px;
    white-space:nowrap;
  }
  .hero-tagline em{color:var(--naranja);font-style:normal;}
  .btn{
    display:inline-block;
    background:var(--magenta);
    color:var(--white);
    font-weight:700;
    font-size:14px;
    letter-spacing:.3px;
    text-transform:uppercase;
    padding:14px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.2), 0 6px 14px rgba(26,26,56,.25);
    transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);opacity:.92;box-shadow:0 6px 0 rgba(0,0,0,.2), 0 8px 18px rgba(26,26,56,.3);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2), 0 3px 8px rgba(26,26,56,.2);}
  .hero-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .hero-ctas .btn{background:var(--magenta);color:var(--white);}

  /* ===== SECTION HEADERS ===== */
  .section{padding:56px 0;}
  .section-head{text-align:center;margin-bottom:34px;}
  .section-head h2{font-size:clamp(24px,3.2vw,34px);color:var(--magenta-dark);margin-bottom:8px;}
  .section-head p{font-size:15px;font-weight:600;color:#55557a;}
  .tag-pill{
    display:inline-block;
    background:var(--rosa);
    color:var(--magenta);
    font-weight:700;
    font-size:12px;
    letter-spacing:.4px;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }

  /* ===== DESTACADAS ===== */
  .destacadas{background:var(--magenta);padding:48px 0 56px;}
  .destacadas .section-head{text-align:left;margin-bottom:24px;}
  .destacadas .section-head h2{color:var(--white);}
  .destacadas .tag-pill{background:rgba(255,255,255,.2);color:var(--white);}
  .destacadas .section-head p{color:rgba(255,255,255,.85);}
  .carousel-wrap{position:relative;}
  .destacadas-track{
    display:flex;
    gap:18px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding-bottom:6px;
    scrollbar-width:none;
  }
  .destacadas-track::-webkit-scrollbar{display:none;}
  .dest-card{
    background:var(--white);
    border-radius:18px;
    padding:18px;
    text-align:left;
    flex:0 0 220px;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
  }
  .dest-logo-box{
    width:100%;aspect-ratio:1/1;
    background:var(--gris);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
    overflow:hidden;
  }
  .dest-logo-box img{width:100%;height:100%;object-fit:cover;}
  .dest-logo-box.placeholder{
    color:var(--white);
    font-family:'Poppins',sans-serif;
    font-weight:900;
    font-size:12px;
    line-height:1.15;
    padding:8px;
    text-align:center;
  }
  .dest-card h3{font-size:15px;font-weight:700;color:var(--magenta-dark);margin-bottom:6px;min-height:20px;}
  .dest-card .cuotas-line{
    font-family:'Poppins',sans-serif;
    font-weight:900;
    font-size:17px;
    color:var(--magenta);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .dest-card .btn{
    background:var(--magenta);
    font-size:12px;
    padding:11px 20px;
    text-align:center;
  }
  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:22px;height:22px;
    border-radius:50%;
    background:var(--rosa);
    color:var(--white);
    border:none;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(26,26,56,.25);
    z-index:3;
  }
  .carousel-arrow:hover{background:var(--white);}
  .carousel-arrow.prev{left:-16px;}
  .carousel-arrow.next{right:-16px;}

  /* ===== FILTROS ===== */
  .filters{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:34px;
  }
  .filter-btn{
    background:var(--white);
    border:2px solid var(--gris);
    color:var(--azul);
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--magenta-dark);}
  .filter-btn.active{
    background:var(--magenta-dark);
    border-color:var(--magenta-dark);
    color:var(--white);
  }

  /* ===== GRID COMERCIOS ===== */
  .comercios-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
  }
  .com-card{
    width:160px;
    background:var(--white);
    border-radius:16px;
    padding:16px 12px 18px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 2px 8px rgba(26,26,56,.06);
  }
  .com-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(26,26,56,.12);}
  .com-logo-box{
    width:100%;aspect-ratio:1/1;
    background:var(--gris);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:12px;
    overflow:hidden;
  }
  .com-logo-box img{width:100%;height:100%;object-fit:cover;}
  .com-logo-box.placeholder{
    color:var(--white);
    font-family:'Poppins',sans-serif;
    font-weight:900;
    font-size:12px;
    line-height:1.15;
    padding:8px;
    text-align:center;
  }
  .com-card h4{
    font-size:13px;
    font-weight:700;
    color:var(--magenta-dark);
    line-height:1.25;
    margin-bottom:10px;
    min-height:32px;
    display:flex;
    align-items:center;
  }
  .com-cuotas{
    display:inline-block;
    background:var(--rosa);
    color:var(--magenta);
    font-weight:900;
    font-size:12px;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .com-card .btn{
    background:var(--magenta);
    font-size:12px;
    padding:10px 16px;
    width:100%;
  }
  .empty-msg{
    text-align:center;
    padding:40px 0;
    font-weight:700;
    color:#8a8aa5;
    display:none;
  }

  /* ===== FOOTER ===== */
  footer{
    background:var(--magenta-dark);
    color:var(--white);
    padding:40px 0 30px;
    text-align:center;
  }
  footer .logo{
    margin:0 auto 28px;
    max-width:110px;
  }
  footer p{font-size:13px;opacity:.75;margin-bottom:18px;font-weight:600;}
  .social-row{display:flex;gap:14px;justify-content:center;}
  .social-row a{
    opacity:.85;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    transition:opacity .15s ease, background .15s ease, color .15s ease;
  }
  .social-row a svg{width:18px;height:18px;fill:currentColor;}
  .social-row a:hover{opacity:1;color:var(--amarillo);background:rgba(255,255,255,.2);}

  @media (max-width:640px){
    .hero{padding:44px 0 56px;}
    .section{padding:40px 0;}
    .dest-card{flex:0 0 200px;}
    .comercios-grid{gap:12px;}
    .com-card{width:155px;}
  }
</style>
</head>

const placeholderColors = ['#1A1A38','#EE2A7B','#B95DEE','#FCA653'];

function onImgError(img, name, i){
  const box = img.parentElement;
  box.classList.add('placeholder');
  box.style.background = placeholderColors[i % placeholderColors.length];
  box.textContent = name;
}

// ===== Render destacadas =====
const destGrid = document.getElementById('destacadas-grid');
destacadas.forEach((d,i)=>{
  const card = document.createElement('div');
  card.className = 'dest-card';
  card.innerHTML = `
    <div class="dest-logo-box">${d.img ? `<img src="${d.img}" alt="${d.name}">` : d.name}</div>
    <h3>${d.name}</h3>
    <div class="cuotas-line">${d.cuotas} cuotas</div>
    <a class="btn" href="${d.url}" target="_blank" rel="noopener">Comprar</a>
  `;
  if(d.img){
    const img = card.querySelector('.dest-logo-box img');
    img.addEventListener('error', ()=> onImgError(img, d.name, i));
  } else {
    card.querySelector('.dest-logo-box').classList.add('placeholder');
    card.querySelector('.dest-logo-box').style.background = placeholderColors[i % placeholderColors.length];
  }
  destGrid.appendChild(card);
});

document.getElementById('dest-prev').addEventListener('click', ()=>{
  destGrid.scrollBy({left:-240, behavior:'smooth'});
});
document.getElementById('dest-next').addEventListener('click', ()=>{
  destGrid.scrollBy({left:240, behavior:'smooth'});
});

function positionDestArrows(){
  const firstCard = destGrid.querySelector('.dest-card');
  const wrap = document.querySelector('.destacadas .carousel-wrap');
  if(!firstCard || !wrap) return;
  const wrapTop = wrap.getBoundingClientRect().top;
  const nameBottom = firstCard.querySelector('h3').getBoundingClientRect().bottom;
  const cuotasTop = firstCard.querySelector('.cuotas-line').getBoundingClientRect().top;
  const midY = ((nameBottom + cuotasTop) / 2) - wrapTop;
  document.querySelectorAll('.destacadas .carousel-arrow').forEach(a=>{ a.style.top = midY + 'px'; });
}
positionDestArrows();
window.addEventListener('resize', positionDestArrows);

// ===== Grilla de comercios + filtros por cuotas (sin "Todas") =====
const grid = document.getElementById('comercios-grid');
const filtersEl = document.getElementById('filters');
const emptyMsg = document.getElementById('empty-msg');
const cuotasDisponibles = [...new Set(comercios.map(c=>c.cuotas))].sort((a,b)=>b-a);

const sorted = [...comercios].sort((a,b)=> b.cuotas - a.cuotas);
sorted.forEach((c,i)=>{
  const card = document.createElement('div');
  card.className = 'com-card';
  card.dataset.cuotas = c.cuotas;
  const logo = c.img
    ? `<img src="${c.img}" alt="${c.name}">`
    : c.name;
  const boxStyle = c.img ? '' : `style="background:${placeholderColors[i % placeholderColors.length]}"`;
  card.innerHTML = `
    <div class="com-logo-box ${c.img ? '' : 'placeholder'}" ${boxStyle}>${logo}</div>
    <h4>${c.name}</h4>
    <span class="com-cuotas">${c.cuotas} cuotas</span>
    <a class="btn" href="${c.url}" target="_blank" rel="noopener">Comprar</a>
  `;
  if(c.img){
    const img = card.querySelector('.com-logo-box img');
    img.addEventListener('error', ()=> onImgError(img, c.name, i));
  }
  grid.appendChild(card);
});

filtersEl.innerHTML = cuotasDisponibles
  .map((n,i)=>`<button class="filter-btn${i===0?' active':''}" data-f="${n}">${n} cuotas</button>`)
  .join('');

function applyFilter(f){
  const cards = grid.querySelectorAll('.com-card');
  let visible = 0;
  cards.forEach(card=>{
    const show = card.dataset.cuotas === f;
    card.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  emptyMsg.style.display = visible === 0 ? 'block' : 'none';
}
applyFilter(String(cuotasDisponibles[0]));

filtersEl.addEventListener('click', e=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  filtersEl.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter(btn.dataset.f);
});
</script>
